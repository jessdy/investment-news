services:
  investment-news:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}"
    image: "${IMAGE_NAME:-investment-news}:${IMAGE_TAG:-latest}"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8793"
      DATA_FILE: "/app/runtime/data.js"
    ports:
      - "${APP_PORT:-8793}:8793"
    volumes:
      - investment-news-data:/app/runtime
    restart: unless-stopped

volumes:
  investment-news-data:
